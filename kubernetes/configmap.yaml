# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: observability
  labels:
    app: agentic-observability
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PROMETHEUS_URL: "http://prometheus-server.monitoring:9090"
  ML_ANOMALY_THRESHOLD: "0.7"
  ML_ENSEMBLE_MODELS: "zscore,isolation_forest,autoencoder"
  AGENT_MAX_CONCURRENT: "5"
  AGENT_MESSAGE_QUEUE_SIZE: "1000"
  API_RATE_LIMIT_REQUESTS: "100"
  API_RATE_LIMIT_WINDOW: "60"
---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: observability-secrets
  namespace: observability
  labels:
    app: agentic-observability
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/observability"
  REDIS_URL: "redis://:password@redis-service:6379/0"
  # Add other secrets as needed
